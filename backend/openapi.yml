          description: ''
    patch:
      operationId: units_partial_update
      description: 'Shared filters: ?property=, ?include_archived=true.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this rental unit.
        required: true
      tags:
      - units
      requestBody:
        content:
          application/json:
