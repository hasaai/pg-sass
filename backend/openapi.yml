openapi: 3.0.3
info:
  title: PG Management SaaS API
  version: 1.0.0
paths:
  /api/v1/amenities/:
    get:
      operationId: amenities_retrieve
      description: 'The amenity catalog, grouped by category. Public: the marketplace
        uses it for filters.'
      parameters:
      - in: query
        name: filterable
        schema:
          type: boolean
      - in: query
        name: property_type
        schema:
          type: string
          enum:
          - apartment
          - building
          - coliving
          - hostel
          - house
          - pg
      tags:
      - amenities
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
          description: ''
  /api/v1/applications/:
    get:
      operationId: applications_list
      description: 'Operator inbox: approve an applicant into a bed, or decline with
        a reason.'
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: listing
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - declined
          - pending
          - withdrawn
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApplicationList'
          description: ''
  /api/v1/applications/{id}/:
    get:
      operationId: applications_retrieve
      description: 'Operator inbox: approve an applicant into a bed, or decline with
        a reason.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this application.
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
  /api/v1/applications/{id}/approve/:
    post:
      operationId: applications_approve_create
      description: Create (or reuse) the tenant and check them into the chosen bed.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this application.
        required: true
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
  /api/v1/applications/{id}/decline/:
    post:
      operationId: applications_decline_create
      description: 'Operator inbox: approve an applicant into a bed, or decline with
        a reason.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this application.
        required: true
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclineRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
  /api/v1/audit-log/:
    get:
      operationId: audit_log_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - audit-log
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/auth/email/confirm:
    post:
      operationId: auth_email_confirm_create
      description: Open the link from the email (signed in or not).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailSent'
          description: ''
  /api/v1/auth/email/send:
    post:
      operationId: auth_email_send_create
      description: Email the confirmation link again.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailSent'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/login/mobile/finish:
    post:
      operationId: auth_login_mobile_finish_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileLoginFinishRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/login/mobile/start:
    post:
      operationId: auth_login_mobile_start_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileLoginStartRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSent'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/mobile/:
    get:
      operationId: auth_mobile_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileStatus'
          description: ''
  /api/v1/auth/mobile/confirm/:
    post:
      operationId: auth_mobile_confirm_create
      description: |-
        Check the code. Not one request-wide transaction: a wrong try must be counted even
        though the answer is an error (which would otherwise roll the count back).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmCodeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/mobile/send-code/:
    post:
      operationId: auth_mobile_send_code_create
      description: Send a 6-digit code to the user's mobile, or to a new number they
        typed.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sent'
          description: ''
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
  /api/v1/auth/register:
    post:
      operationId: auth_register_create
      description: Create an operator account, its organization and the owner membership.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/register-seeker:
    post:
      operationId: auth_register_seeker_create
      description: Create an account for someone looking for a PG (no organization).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeekerRegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/signup/finish:
    post:
      operationId: auth_signup_finish_create
      description: 'Step 2: the right code makes the account (or signs in the one
        already using it).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupFinishRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/signup/start:
    post:
      operationId: auth_signup_start_create
      description: 'Step 1: agree to Terms and Privacy, give a mobile; a 6-digit code
        is sent.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupStartRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSent'
          description: ''
  /api/v1/beds/:
    get:
      operationId: beds_list
      description: 'Shared filters: ?property=, ?include_archived=true.'
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: include_archived
        schema:
          type: boolean
        description: Also list removed (archived) records.
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: property
        schema:
          type: string
      - in: query
        name: room
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - blocked
          - occupied
          - reserved
          - vacant
      tags:
      - beds
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBedList'
          description: ''
    post:
      operationId: beds_create
      description: 'Shared filters: ?property=, ?include_archived=true.'
      tags:
      - beds
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BedRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bed'
          description: ''
  /api/v1/beds/{id}/:
    get:
      operationId: beds_retrieve
      description: 'Shared filters: ?property=, ?include_archived=true.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this bed.
        required: true
      tags:
      - beds
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bed'
          description: ''
    patch:
      operationId: beds_partial_update
      description: 'Shared filters: ?property=, ?include_archived=true.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this bed.
        required: true
      tags:
      - beds
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBedRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bed'
          description: ''
    delete:
      operationId: beds_destroy
      description: 'Shared filters: ?property=, ?include_archived=true.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this bed.
        required: true
      tags:
      - beds
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/beds/{id}/archive/:
    post:
      operationId: beds_archive_create
      description: Hide it (and everything inside it). Kept for old tenancies and
        invoices.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this bed.
        required: true
      tags:
      - beds
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/beds/{id}/restore/:
    post:
      operationId: beds_restore_create
      description: Bring it back. Things inside it stay removed until restored one
        by one.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this bed.
        required: true
      tags:
      - beds
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/complaints/:
    get:
      operationId: complaints_list
      description: Caretakers log and update complaints; deleting needs complaints.delete.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: open
        schema:
          type: boolean
        description: Open or in progress
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: property
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - closed
          - in_progress
          - open
          - resolved
      tags:
      - complaints
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedComplaintList'
          description: ''
    post:
      operationId: complaints_create
      description: Caretakers log and update complaints; deleting needs complaints.delete.
      tags:
      - complaints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplaintRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Complaint'
          description: ''
  /api/v1/complaints/{id}/:
    get:
      operationId: complaints_retrieve
      description: Caretakers log and update complaints; deleting needs complaints.delete.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this complaint.
        required: true
      tags:
      - complaints
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Complaint'
          description: ''
    patch:
      operationId: complaints_partial_update
      description: Caretakers log and update complaints; deleting needs complaints.delete.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this complaint.
        required: true
      tags:
      - complaints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedComplaintRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Complaint'
          description: ''
    delete:
      operationId: complaints_destroy
      description: Caretakers log and update complaints; deleting needs complaints.delete.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this complaint.
        required: true
      tags:
      - complaints
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/employees/:
    get:
      operationId: employees_list
      description: CRUD on organization data; reading and changing each need a permission.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - employees
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEmployeeList'
          description: ''
    post:
      operationId: employees_create
      description: CRUD on organization data; reading and changing each need a permission.
      tags:
      - employees
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
  /api/v1/employees/{id}/:
    get:
      operationId: employees_retrieve
      description: CRUD on organization data; reading and changing each need a permission.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this employee.
        required: true
      tags:
      - employees
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
    patch:
      operationId: employees_partial_update
      description: CRUD on organization data; reading and changing each need a permission.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this employee.
        required: true
      tags:
      - employees
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
    delete:
      operationId: employees_destroy
      description: CRUD on organization data; reading and changing each need a permission.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this employee.
        required: true
      tags:
      - employees
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/employees/{id}/pay/:
    post:
      operationId: employees_pay_create
      description: Record this month's salary payout (once per employee per month).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this employee.
        required: true
      tags:
      - employees
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaySalaryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
          description: ''
  /api/v1/enquiries/:
    get:
      operationId: enquiries_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: listing
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - contacted
          - converted
          - lost
          - new
          - visit_scheduled
      tags:
      - enquiries
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEnquiryList'
          description: ''
  /api/v1/enquiries/{id}/:
    get:
      operationId: enquiries_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this enquiry.
        required: true
      tags:
      - enquiries
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enquiry'
          description: ''
    patch:
      operationId: enquiries_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this enquiry.
        required: true
      tags:
      - enquiries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEnquiryRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enquiry'
          description: ''
  /api/v1/expenses/:
    get:
      operationId: expenses_list
      description: CRUD on organization data; reading and changing each need a permission.
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - electricity
          - groceries
          - housekeeping
          - internet
          - maintenance
          - marketing
          - other
          - rent
          - salary
          - tax
          - water
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: period
        schema:
          type: string
        description: YYYY-MM
      - in: query
        name: property
        schema:
          type: string
      tags:
      - expenses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExpenseList'
          description: ''
    post:
      operationId: expenses_create
      description: CRUD on organization data; reading and changing each need a permission.
      tags:
      - expenses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
          description: ''
  /api/v1/expenses/{id}/:
